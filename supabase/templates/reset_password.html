<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset your CommonTable password</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background-color: #fafafa;
      color: rgba(0, 0, 0, 0.87);
      line-height: 1.5;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 48px 24px;
    }

    .card {
      background-color: #ffffff;
      border-radius: 4px;
      box-shadow: 0px 1px 3px rgba(0, 0, 0, 0.12), 0px 1px 2px rgba(0, 0, 0, 0.24);
      padding: 32px;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 500;
      color: #1976d2;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 500;
      margin: 0 0 24px 0;
      color: rgba(0, 0, 0, 0.87);
      line-height: 1.4;
    }

    p {
      font-size: 1rem;
      margin: 0 0 16px 0;
      color: rgba(0, 0, 0, 0.87);
      line-height: 1.5;
    }

    .button {
      display: inline-block;
      background-color: #1976d2;
      color: #ffffff;
      text-decoration: none;
      padding: 10px 24px;
      border-radius: 4px;
      font-weight: 500;
      font-size: 0.875rem;
      margin: 24px 0;
      text-transform: none;
    }

    .button:hover {
      background-color: #1565c0;
    }

    .meta {
      font-size: 0.875rem;
      color: rgba(0, 0, 0, 0.6);
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid rgba(0, 0, 0, 0.12);
    }

    .footer {
      text-align: center;
      margin-top: 32px;
      font-size: 0.875rem;
      color: rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo">CommonTable</div>

      <h1>Reset your password</h1>

      <p>You requested to reset your password. Click the button below to create a new password.</p>

      <a href="{{ .ConfirmationURL }}" class="button">Reset Password</a>

      <p class="meta">This link expires in 1 hour. If you did not request a password reset, you can ignore this email.</p>
    </div>

    <div class="footer">
      <p>CommonTable - Your household recipe book</p>
    </div>
  </div>
</body>
</html>
